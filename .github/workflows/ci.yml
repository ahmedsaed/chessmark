name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chessmark
          POSTGRES_PASSWORD: chessmark
          POSTGRES_DB: chessmark_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://chessmark:chessmark@localhost:5432/chessmark_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      - name: Tests
        run: uv run pytest --cov=chessmark --cov-report=term-missing

      # NFR-07: the chess domain and the agent runtime carry a hard coverage floor.
      # A gap here is a benchmark measuring the wrong thing, so it fails the build.
      - name: Chess domain coverage gate
        run: uv run pytest tests/game --cov=chessmark.game --cov-fail-under=90 -q

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      # No `version:` — the pnpm version comes from `packageManager` in
      # apps/web/package.json, the single source of truth. The action resolves
      # package.json from the repo root, so the path must be given explicitly;
      # the job's working-directory does not apply to it.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `next typegen` must run before tsc: Next.js 16 generates the global
      # route types (LayoutProps, PageProps) that the app code depends on.
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # NFR-10: frontend logic coverage is measured and enforced, not merely reported.
      - name: Unit tests with coverage
        run: pnpm test:coverage

      # AUTH-07 / invariant 10: no API key may reach the client. Asserted against the built
      # output rather than trusted, because `NEXT_PUBLIC_` prefixing turns any variable into a
      # client-visible one and nothing else would catch a rename.
      - name: No secrets in the client bundle
        working-directory: .
        run: python3 scripts/check_bundle_secrets.py

  browser:
    name: Browser suite (public pages)
    runs-on: ubuntu-latest

    # Only the public project runs here. Reading is open to everyone (AUTH-02), so the lobby, the
    # catalogue, a model page and a whole replay need no identity at all. The signed-in flows need
    # a real Clerk development instance and are opt-in — `make test-e2e-all` — the same bargain the
    # `llm` pytest marker strikes. A test that depends on something external is never silently
    # green.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chessmark
          POSTGRES_PASSWORD: chessmark
          POSTGRES_DB: chessmark
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://chessmark:chessmark@localhost:5432/chessmark
      REDIS_URL: redis://localhost:6379/0
      NEXT_PUBLIC_API_URL: http://localhost:8010
      E2E_WEB_URL: http://localhost:3010

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install backend
        working-directory: apps/api
        run: uv sync --all-groups --frozen

      - name: Migrate
        working-directory: apps/api
        run: uv run alembic upgrade head

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # Built and served, not `next dev`. The suite should assert what a visitor gets.
      - name: Build the web app
        working-directory: apps/web
        run: pnpm build

      - name: Start the API
        working-directory: apps/api
        run: |
          uv run uvicorn chessmark.main:app --port 8010 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8010/health && break
            sleep 1
          done

      - name: Start the web app
        working-directory: apps/web
        run: |
          pnpm start &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3010/ >/dev/null && break
            sleep 1
          done

      # The suite seeds its own fixtures (a scripted game played through the real queue and
      # worker) and starts its own scripted worker. Nothing calls a provider; nothing is spent.
      - name: Browser suite
        working-directory: apps/web
        run: pnpm exec playwright test --project=public

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The images, built and not pushed.
  #
  # This job exists because of what its absence cost: `next build` inside the web image failed on
  # `main` and nowhere else, so the backend image published and the web image did not — a deploy
  # with no front end to pull, discovered on the server. Nothing here validated a Dockerfile
  # before the push that publishes it.
  #
  # It is deliberately built with **no build args**, which is the shape that broke: an unset
  # GitHub Actions variable reaches `docker build` as an empty value, and there is no API to reach
  # at build time either. So this asserts the case a deploy must survive — a misconfigured
  # environment and an unreachable API produce an image, not a failed build. The `web` job above
  # covers the opposite case, a build against a live API, and `lib/env.test.ts` pins the rule.
  images:
    name: Images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Scoped per image and shared with the publishing workflow, which builds the same two
      # contexts from the same Dockerfiles: a merge to `main` then mostly imports what its own
      # pull request already built.
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
