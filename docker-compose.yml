name: chessmark

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chessmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chessmark}
      POSTGRES_DB: ${POSTGRES_DB:-chessmark}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chessmark} -d ${POSTGRES_DB:-chessmark}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A public address for the local API, so a payment processor's webhooks can reach it while
  # developing (ADR-0055). **Development only, and only on request**: the `tunnel` profile keeps it
  # out of `make up` and out of production, which layers its own file over this one.
  #
  # A Cloudflare quick tunnel: no account, a random `*.trycloudflare.com` address that changes
  # every time it starts, gone when it stops. While it runs, **anyone with the address reaches the
  # local API** — writes still need a signed-in token, but it is the local database behind it.
  # `make tunnel` starts it and prints the address; `make tunnel-down` stops it.
  #
  # Host networking because the API listens on 127.0.0.1, which a bridged container cannot reach.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:${API_PORT:-8010}

volumes:
  postgres_data:
  redis_data:
